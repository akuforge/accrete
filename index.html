<title>Accrete</title>
<style>
@font-face{font-family:'Cormorant';src:url(fonts/cormorant.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:'Cormorant';src:url(fonts/cormorant-italic.woff2) format('woff2');font-weight:300 700;font-style:italic;font-display:swap}
:root{--void:#05060e;--star:#f2eee3;--dust:#8c93b8;--gold:#f3b562;--ice:#9fd8ff;--red:#ff5a4e;--glass:rgba(13,15,30,.74);--line:rgba(242,238,227,.14);--serif:'Cormorant',Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
html,body{margin:0;height:100%;min-height:100lvh;background:var(--void);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);color:var(--star)}
#c{position:fixed;top:0;left:0;touch-action:none;display:block}
.hidden{display:none!important}
svg.i{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px;flex:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
/* ---- HUD: an instrument, not a dashboard */
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 40px) calc(env(safe-area-inset-right) + 18px) 0 calc(env(safe-area-inset-left) + 18px)}
#hud{text-shadow:none;-webkit-font-smoothing:antialiased}
.hrow{display:flex;align-items:flex-start;gap:16px}
.inst{flex:1;max-width:380px;min-width:0}
.srow{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
#sname{font:600 28px/1 var(--serif);letter-spacing:.005em}
#cyc{font:italic 500 17px/1 var(--serif);color:var(--gold)}
.rail{position:relative;height:16px;margin:9px 0 5px}
.rail:before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.rail .tk{position:absolute;top:5px;width:1px;height:6px;margin-left:-.5px;background:rgba(242,238,227,.3);transition:left .7s var(--ease)}
.rail .tk.past{background:rgba(243,181,98,.75)}
#railseg{position:absolute;top:2px;height:12px;margin-left:-1px;border:1px solid rgba(243,181,98,.32);border-radius:6px;box-sizing:border-box;transition:left .7s var(--ease),width .7s var(--ease)}
#railfill{position:absolute;left:0;top:calc(50% - .75px);height:1.5px;background:linear-gradient(90deg,rgba(243,181,98,.25),var(--gold))}
#railbead{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--star);box-shadow:0 0 0 2px rgba(243,181,98,.55),0 0 14px rgba(243,181,98,.9)}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:500 13px/1.2 var(--sans);font-variant-numeric:tabular-nums;color:var(--dust)}
#smass{color:var(--star)}
#smass sup{color:var(--gold);font-size:.8em;margin-left:1px}
#snext{font:italic 500 16px/1 var(--serif);white-space:nowrap}
.goal{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font:italic 500 16px/1.15 var(--serif);color:var(--dust)}
.goal.done{color:var(--gold)}
#gprog{font:600 12px var(--sans);font-style:normal;font-variant-numeric:tabular-nums;color:var(--star);opacity:.8}
.ibtn{pointer-events:auto;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(13,15,30,.55);display:grid;place-items:center;padding:0;touch-action:manipulation}
#perks{display:flex;flex-wrap:wrap;gap:13px;margin-top:11px;max-width:380px;color:var(--dust)}
#perks .pk{display:inline-flex;align-items:flex-start;gap:1px;font:650 10px/1 var(--sans);font-variant-numeric:tabular-nums}
#perks .pk svg{width:17px;height:17px}
#perks .pk.sh{color:var(--ice)}
#bossbar{margin-top:13px;max-width:380px}
#bossname{font:italic 600 19px/1.1 var(--serif);color:#ffb3a8}
#bossstate{font:500 12px var(--sans);color:var(--dust);margin-left:8px}
.bbar{height:2px;background:rgba(255,90,78,.18);margin-top:7px;border-radius:1px}
.bbar i{display:block;height:100%;background:var(--red);transform-origin:0 50%}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 34px);transform:translate(-50%,8px);display:flex;align-items:center;gap:10px;font:500 14px var(--sans);background:var(--glass);border:1px solid var(--line);padding:11px 18px 11px 14px;border-radius:14px;opacity:0;transition:opacity .25s,transform .25s var(--ease);pointer-events:none;white-space:nowrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#toast:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* ---- overlays */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at 50% 42%,rgba(5,6,14,.5),rgba(5,6,14,.92));-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);text-align:center;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 20px);box-sizing:border-box;overflow-y:auto}
.ov.light{background:radial-gradient(ellipse at 50% 45%,rgba(5,6,14,.1),rgba(5,6,14,.72));-webkit-backdrop-filter:none;backdrop-filter:none}
h1{font:500 clamp(58px,18vw,108px)/.88 var(--serif);letter-spacing:.015em;margin:0;text-shadow:0 0 44px rgba(243,181,98,.32)}
.tag{margin:12px 0 36px;font:italic 500 20px var(--serif);color:var(--dust)}
h2{font:600 clamp(40px,12vw,60px)/1 var(--serif);margin:6px 0 20px}
.kick{font:italic 500 19px/1.2 var(--serif);color:var(--dust);max-width:320px}
.psub{font:600 36px/1.05 var(--serif);margin:4px 0 22px}
.btn{appearance:none;-webkit-appearance:none;display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(300px,82vw);box-sizing:border-box;margin:5px 0;padding:15px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(13,15,30,.45);font:500 16px/1 var(--sans);touch-action:manipulation;text-align:left}
.btn .cnt{display:inline-flex;align-items:center;gap:5px;font:500 13px var(--sans);color:var(--dust);font-variant-numeric:tabular-nums}
.btn .cnt svg{width:14px;height:14px;color:var(--gold)}
.btn.pri{justify-content:center;background:var(--gold);border-color:transparent;color:#1a1206;font-weight:650;box-shadow:0 12px 30px -12px rgba(243,181,98,.75)}
.btn.quiet{justify-content:center;background:none;border-color:transparent;color:#ff9c92;font-size:15px}
.btn:active{transform:scale(.985)}
.snd{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;justify-content:center}
.snd button{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(13,15,30,.45);font:500 13px var(--sans);touch-action:manipulation}
.snd button svg{width:16px;height:16px}
.snd button.off{color:var(--dust);opacity:.6;text-decoration:line-through}
.rec{font:500 13px/1.55 var(--sans);color:var(--dust);margin:18px 0 0;max-width:320px}
.rec b{color:var(--star);font-weight:600}
.cards{display:flex;flex-direction:column;gap:10px;width:min(440px,92vw)}
.card{display:flex;gap:16px;align-items:center;text-align:left;padding:16px 18px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font:inherit;touch-action:manipulation;opacity:0;transform:translateY(10px);transition:opacity .35s var(--ease),transform .35s var(--ease),border-color .2s}
.card.in{opacity:1;transform:none}
.card:active{border-color:rgba(243,181,98,.65)}
.card .gl{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--gold);border:1px solid rgba(243,181,98,.45);box-shadow:inset 0 0 16px rgba(243,181,98,.14)}
.card .gl svg{width:22px;height:22px}
.card b{display:block;font:600 22px/1.05 var(--serif);margin-bottom:5px}
.card small{font:400 14px/1.35 var(--sans);color:var(--dust);display:block}
.pips{display:flex;gap:5px;margin-top:9px}
.pips i{width:6px;height:6px;border-radius:50%;border:1px solid rgba(243,181,98,.55);box-sizing:border-box}
.pips i.on{background:var(--gold);border-color:var(--gold)}
.pips i.nx{background:rgba(243,181,98,.4);border-color:var(--gold);box-shadow:0 0 6px rgba(243,181,98,.8)}
.stats{display:flex;gap:30px;justify-content:center;margin:2px 0 18px}
.stats b{display:block;font:600 22px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.stats span{font:italic 500 16px var(--serif);color:var(--dust)}
.nb{display:inline-flex;align-items:center;gap:7px;font:600 15px var(--sans);color:var(--gold);margin:2px 0 14px}
.nb svg{width:16px;height:16px}
.album{width:min(580px,94vw);max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:4px 0 16px;text-align:center}
.ac{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.ac canvas{width:64px;height:64px}
.ac b{display:block;font:600 18px/1.1 var(--serif);margin-top:6px}
.ac small{display:block;font:400 12.5px/1.4 var(--sans);color:var(--dust);margin-top:5px}
.ac i{display:block;font:500 11px var(--sans);color:var(--dust);opacity:.75;margin-top:6px;font-style:normal;font-variant-numeric:tabular-nums}
.ac.lock{opacity:.45}
.ac.trophy{border-color:rgba(243,181,98,.55)}
.shop{width:min(460px,94vw);max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:9px;margin:4px 0 16px;text-align:left}
.row{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.row .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--gold);border:1px solid rgba(243,181,98,.4)}
.row b{display:block;font:600 18px/1.1 var(--serif)}
.row b small{display:inline;font:500 12px var(--sans);color:var(--dust);margin-left:4px}
.row>span>small{font:400 12.5px/1.35 var(--sans);color:var(--dust);display:block;margin-top:3px}
.row button{margin-left:auto;flex:none;appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;border-radius:11px;padding:9px 13px;font:650 14px var(--sans);font-variant-numeric:tabular-nums;background:var(--gold);color:#1a1206;touch-action:manipulation;min-width:82px}
.row button svg{width:14px;height:14px}
.row button:disabled{background:rgba(242,238,227,.08);color:rgba(242,238,227,.4)}
.row button.eq{background:rgba(159,216,255,.16);color:var(--ice)}
.sw{width:26px;height:26px;border-radius:50%;flex:none;margin:0 7px;box-shadow:0 0 12px currentColor}
.shead{font:italic 500 18px var(--serif);color:var(--dust);margin:8px 2px 0}
.card.r .gl{color:var(--ice);border-color:rgba(159,216,255,.5);box-shadow:inset 0 0 16px rgba(159,216,255,.16)}
.card.l{border-color:rgba(243,181,98,.55);background:linear-gradient(160deg,rgba(60,42,18,.55),var(--glass) 55%)}
.card.l .gl{box-shadow:inset 0 0 18px rgba(243,181,98,.3),0 0 18px rgba(243,181,98,.35)}
.card.p{border-color:rgba(255,90,78,.35)}
.card.p .gl{color:#ff8f84;border-color:rgba(255,90,78,.5);box-shadow:inset 0 0 16px rgba(255,90,78,.15)}
.card small.dn{color:#ff9c92;margin-top:4px}
.rar{display:block;font:italic 500 15px var(--serif);margin-top:6px;color:var(--ice)}
.card.l .rar{color:var(--gold)}
.btn.quiet.gold{color:var(--gold)}
#perks .pk.rl{color:var(--gold)}
#perks .pk.pc{color:#ff8f84}
.runlog{width:min(320px,86vw);text-align:left;margin:-8px 0 18px;display:flex;flex-direction:column;gap:10px}
.runlog div{display:flex;gap:12px;align-items:flex-start;color:var(--dust);font:400 13px/1.35 var(--sans)}
.runlog svg{color:var(--gold);margin-top:2px}
.runlog b{display:block;font:600 17px/1.1 var(--serif);color:var(--star);margin-bottom:2px}
.ov.tray{justify-content:flex-end;background:linear-gradient(0deg,rgba(5,6,14,.92),rgba(5,6,14,.6) 45%,rgba(5,6,14,0) 80%);-webkit-backdrop-filter:none;backdrop-filter:none;padding-bottom:calc(env(safe-area-inset-bottom) + 18px)}
.ov.tray .card{transform:translateY(40px);background:rgba(12,14,28,.96)}
.ptiles{display:flex;gap:9px;width:min(480px,95vw);justify-content:center;align-items:stretch}
.tile{appearance:none;-webkit-appearance:none;flex:1;max-width:122px;min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:14px 6px 10px;border-radius:16px;background:rgba(12,14,28,.95);border:1px solid var(--line);color:var(--star);touch-action:manipulation;-webkit-touch-callout:none;opacity:0;transform:translateY(36px);transition:opacity .3s var(--ease),transform .3s var(--ease),border-color .2s}
.tile.in{opacity:1;transform:none}
.tile:active{border-color:rgba(243,181,98,.8);transform:scale(.97)}
.tile svg{width:34px;height:34px;color:var(--gold);stroke-width:1.5}
.tile b{font:600 17px/1.05 var(--serif);text-align:center}
.tile .pips{margin-top:0;min-height:6px}
.tile.r{border-color:rgba(159,216,255,.5)}.tile.r svg{color:var(--ice)}
.tile.l{border-color:rgba(243,181,98,.85);background:linear-gradient(170deg,rgba(60,42,16,.96),rgba(12,14,28,.96) 60%);box-shadow:0 0 26px -10px rgba(243,181,98,.9)}
.tile.p{border-color:rgba(255,90,78,.55)}.tile.p svg{color:#ff8f84}
.pips i.minus{width:10px;height:2px;border:0;border-radius:1px;background:#ff8f84}
.rr{appearance:none;-webkit-appearance:none;flex:none;width:44px;align-self:center;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(12,14,28,.9);color:var(--gold);display:grid;place-items:center;position:relative;padding:0;touch-action:manipulation}
.rr span{position:absolute;right:-3px;top:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:#1a1206;font:700 10px/16px var(--sans)}
.tipline{font:italic 500 17px/1.25 var(--serif);color:var(--dust);margin-bottom:12px;max-width:340px;min-height:22px;transition:color .2s}
.tipline.on{color:var(--star)}
.ov.tray .card.l{background:linear-gradient(160deg,rgba(58,40,16,.97),rgba(12,14,28,.97) 55%)}
.ov.tray .card.in{transform:none}
@media (orientation:landscape) and (max-height:520px){.cards{flex-direction:row;width:min(880px,96vw)}.card{flex:1;flex-direction:column;text-align:center}.pips{justify-content:center}.tag{margin-bottom:14px}h1{font-size:64px}}
@media (prefers-reduced-motion:reduce){.card,.rail .tk,#railseg,#toast{transition:none}}
</style>

<script>

(()=>{

function radial(c,x0,y0,r0,x1,y1,r1,stops){const gr=c.createRadialGradient(x0,y0,r0,x1,y1,r1);for(const s of stops)gr.addColorStop(s[0],s[1]);return gr;}
const pick=(R,a)=>a[(R()*a.length)|0];
function shade(c,r,k=.8){c.fillStyle=radial(c,-r*.45,-r*.5,r*.05,-r*.15,-r*.15,r*1.25,[[0,'rgba(255,255,255,.22)'],[.4,'rgba(255,255,255,0)'],[.75,'rgba(0,0,0,'+k*.55+')'],[1,'rgba(0,0,0,'+k+')']]);circle(c,0,0,r);c.fill();}
function halo(c,r,R1,col,a){c.fillStyle=radial(c,0,0,r*.3,0,0,R1,[[0,rgba(col,a)],[.35,rgba(col,a*.35)],[1,rgba(col,0)]]);circle(c,0,0,R1);c.fill();}
function blobPts(r,R,n,rough){const p=[];for(let i=0;i<n;i++){const a=(i+R()*.4)/n*TAU,d=r*(1-rough*R());p.push(Math.cos(a)*d,Math.sin(a)*d);}return p;}
function trace(c,p){const n=p.length/2;c.beginPath();c.moveTo((p[(n-1)*2]+p[0])/2,(p[(n-1)*2+1]+p[1])/2);for(let i=0;i<n;i++){const x=p[i*2],y=p[i*2+1],j=((i+1)%n)*2;c.quadraticCurveTo(x,y,(x+p[j])/2,(y+p[j+1])/2);}c.closePath();}
function crater(c,r,R,dk=.3){const a=R()*TAU,d=Math.sqrt(R())*r*.72,x=Math.cos(a)*d,y=Math.sin(a)*d,cr=r*(.05+R()*.15);c.fillStyle='rgba(0,0,0,'+dk+')';circle(c,x,y,cr);c.fill();c.fillStyle='rgba(0,0,0,'+dk*.6+')';circle(c,x-cr*.15,y-cr*.15,cr*.7);c.fill();c.strokeStyle='rgba(255,255,255,.15)';c.lineWidth=Math.max(.5,cr*.2);c.beginPath();c.arc(x,y,cr,.15*Math.PI,1.05*Math.PI);c.stroke();}
function rockDraw(rough,craters,pal){return(c,r,R)=>{const cols=pick(R,pal);const p=blobPts(r,R,9+((R()*6)|0),rough);
 trace(c,p);c.fillStyle=radial(c,-r*.2,-r*.2,r*.05,0,0,r,[[0,cols[0]],[.6,cols[1]],[1,cols[2]]]);c.fill();
 c.save();trace(c,p);c.clip();
 for(let i=0;i<18;i++){c.fillStyle=R()<.5?'rgba(255,255,255,'+(.03+R()*.06)+')':'rgba(0,0,0,'+(.05+R()*.1)+')';circle(c,(R()*2-1)*r,(R()*2-1)*r,r*(.04+R()*.14));c.fill();}
 for(let i=0;i<craters;i++)crater(c,r,R);
 c.restore();
 trace(c,p);c.fillStyle=radial(c,0,0,r*.45,0,0,r,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.4)']]);c.fill();
 c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=Math.max(1,r*.035);c.stroke();};}

 on('bAgain',()=>startRun(null,!!run.daily));on('bMenu',showTitle);if(Q.has('demo'))setTimeout(()=>startRun(null),1500);}
function saveRun(){if(!P||!P.alive||!(state==='play'||state==='pick'||state==='paused'))return;try{localStorage.setItem(SV,JSON.stringify({r:P.r,stage:P.stage,pend:pendingPicks+(state==='pick'?1:0),px:P.x,py:P.y,cosT,run:{seed:run.seed,daily:run.daily,gone:[...run.gone],laws:run.laws,ignited:run.ignited,goal:run.goal,bonusDust:run.bonusDust,origin:run.origin,pacts:run.pacts,relics:run.relics,syn:run.syn,rerolls:run.rerolls,maxStage:Math.max(P.stage,run.maxStage||0),bossWins:run.bossWins||0,bossDone:run.bossDone,perks:run.perks,shields:run.shields,phoenixUsed:run.phoenixUsed,cycle:run.cycle,time:run.time,eaten:run.eaten}}));}catch(e){}}
$('bPause').addEventListener('click',e=>{e.stopPropagation();pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveRun();pause();try{if(AC)AC.suspend();if(silentEl)silentEl.pause();}catch(e){}}});
addEventListener('pagehide',saveRun);

window.__dbg=()=>({run,P,objs,state,ap:autopilot,zoom});
window.__acc=()=>({dust:rec.dust,boss:run&&run.boss?run.boss.boss.d.name+' r'+(run.boss.r/P.r).toFixed(2):'',codex:Object.keys(rec.codex).length,shocks:shocks.length,ms:+(benchMs).toFixed(2),killer,state,stage:P&&P.stage,r:P&&+P.r.toFixed(1),cycle:run&&run.cycle,objs:objs.length,parts:parts.length,eaten:run&&run.eaten,perks:run&&run.perks,sprites:SC.size,spx:scPix,hud:$('sname').textContent+' | '+$('smass').textContent});
// ---------- main loop
let last=performance.now(),benchMs=0,tScale=1;
function loop(now){let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>.05)dt=.05;frame++;simT+=dt;
 tScale+=((state==='pick'?.12:1)-tScale)*Math.min(1,dt*(state==='pick'?7:2.4));
 if(state==='pick'){const sd=dt*tScale;P.inv=Math.max(P.inv,1);run.time+=sd;updatePlayer(sd,false);stepShocks(sd);stepWorld(sd,true);stepCrumbs(sd,true);camera(sd);stepParts(sd);cosT+=sd;structPos();}
 if(state==='play'||state==='title'||state==='dead'||state==='bang'){const dt0=dt;dt=state==='play'?dt*tScale:dt;cosT+=dt;cosTk-=dt;if(cosTk<=0){cosTk=.2;cosmosTick();}structPos();}
 if(state==='play'){run.time+=dt;updatePlayer(dt,Q.has('demo'));bossStep(dt);eventStep(dt);anomStep(dt);stepShocks(dt);stepWorld(dt,true);stepCrumbs(dt,true);camera(dt);stepParts(dt);hud();
  if(pendingPicks>0&&state==='play'){pickDelay-=dt;if(pickDelay<=0)showPick();}
  run.saveT-=dt;if(run.saveT<=0){run.saveT=4;saveRun();}}
 else if(state==='title'){updatePlayer(dt,true);stepWorld(dt,true);stepCrumbs(dt,true);camera(dt);stepParts(dt);if(needAttract){needAttract=false;attract();}}
 else if(state==='dead'){deathT+=dt;stepShocks(dt);stepWorld(dt,false);stepParts(dt);if(deathT>1.3&&!overShown)showOver();}
 else if(state==='bang'){bangUpdate(dt);stepWorld(dt,false);camera(dt,run._reset&&bangT<.75);stepParts(dt);}
 if(banner&&state!=='paused')banner.t+=state==='pick'?dt*.5:dt;
 shake=Math.max(0,shake-dt*2.5);if(state!=='bang')flash=Math.max(0,flash-dt*1.2);frameDt=dt;musicTick();
 const t0=performance.now();render(simT);benchMs=benchMs*.95+(performance.now()-t0)*.05;if(Q.has('bench')&&frame%60===0)document.title='MS '+benchMs.toFixed(2)+' spx '+scPix+' n '+SC.size;requestAnimationFrame(loop);}

// ---------- icon render mode (used once to make the home-screen icon)
if(Q.has('icon'))setTimeout(()=>{resize();run=freshRun();P=newPlayer(R0*Math.pow(STEP,6.4));P.v=0;state='icon';
 const S=Math.min(W,H);g.setTransform(DPR,0,0,DPR,0,0);g.fillStyle='#03030c';g.fillRect(0,0,W,H);
 const b=(x,y,rad,c,a)=>{const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,rgba(c,a));gr.addColorStop(1,rgba(c,0));g.fillStyle=gr;g.fillRect(0,0,W,H);};
 b(S*.2,S*.2,S*.9,[90,40,140],.55);b(S*.9,S*.85,S*.8,[20,70,140],.5);
 g.fillStyle='#fff';const R=mulberry(42);for(let i=0;i<70;i++){g.globalAlpha=.3+R()*.7;const s=R()*2.2+.4;g.fillRect(R()*S,R()*S,s,s);}g.globalAlpha=1;
 const cx=S*.5,cy=S*.5,pr=S*.2;
 g.globalCompositeOperation='lighter';for(let i=0;i<260;i++){const t=R(),a=t*Math.PI*3.2+R()*.3,d=pr*1.15+t*S*.32,s=(1-t)*S*.012+.8;g.fillStyle=rgba(lerpC([255,210,140],[150,180,255],t),.25+(1-t)*.5);g.fillRect(cx+Math.cos(a)*d,cy+Math.sin(a)*d*.62,s,s);}g.globalCompositeOperation='source-over';
 for(let i=0;i<7;i++){const a=R()*TAU,d=pr*(1.5+R()*1.1),rs=pr*(.07+R()*.12);drawBody(['asteroid','stone','moon','boulder'][i%4],i%6,cx+Math.cos(a)*d,cy+Math.sin(a)*d*.62,rs,R()*TAU);}
 g.fillStyle=radial(g,cx,cy,pr*.8,cx,cy,pr*1.8,[[0,'rgba(255,255,255,.18)'],[1,'rgba(255,255,255,0)']]);circle(g,cx,cy,pr*1.8);g.fill();
 drawBody('planet',0,cx,cy,pr,0);const im=document.createElement('pre');im.id='png';im.textContent=cv.toDataURL('image/png');document.body.appendChild(im);},200);
else{
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
 const checkBuild=()=>{if(location.protocol!=='https:')return;fetch(location.pathname+'?vc='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/const BUILD='([^']+)'/);if(m&&m[1]!==BUILD&&(state==='title'||state==='dead'))location.reload();}).catch(()=>{});};
 setTimeout(checkBuild,1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(checkBuild,800);});
 if(Q.has('demo'))startRun(null,false,Q.get('origin')||null);else showTitle();
 if(Q.get('view')==='album')showAlbum(showTitle);if(Q.get('view')==='shop')showShop();
 if(Q.get('view')==='pick'){startRun(null);pendingPicks=1;setTimeout(showPick,900);}if(Q.get('view')==='pause'){startRun(null,false,'iron');run.perks={well:2,magnet:2,dash:1};run.pacts=['hunger'];run.relics=['king'];run.syn=['disk'];run.laws=['grav'];setTimeout(pause,1200);}if(Q.get('view')==='origins')showOrigins();if(Q.get('view')==='pickx'){startRun(null);P.stage=6;const rp=rollPerks;rollPerks=()=>['horizon','chain','pact:hunger'];pendingPicks=1;setTimeout(showPick,900);}if(Q.get('view')==='over'){startRun(null);setTimeout(()=>{run.eaten=231;run.time=412;killer='a rogue Moon';P.alive=false;state='dead';deathT=2;finishRun();showOver();},1200);}
 requestAnimationFrame(t=>{last=t;loop(t);});}
})();
